name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: agpop
            artifact: agpop-linux-amd64
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bin: agpop
            artifact: agpop-linux-arm64
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            target: aarch64-apple-darwin
            bin: agpop
            artifact: agpop-darwin-arm64
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: agpop.exe
            artifact: agpop-windows-amd64.exe
            rustflags: "-C target-feature=+crt-static -C link-arg=/Brepro"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: agpop.exe
            artifact: agpop-windows-arm64.exe
            rustflags: "-C target-feature=+crt-static -C link-arg=/Brepro"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-crt-static-v1
      - name: Install build tools (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools file
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            pip3 install --break-system-packages ziglang cargo-zigbuild
          fi
      - name: Run Unit Tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build, Verify Baseline & Smoke Test
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" && "${{ matrix.os }}" == ubuntu-* ]]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

          # 1. Native startup, CLI smoke test & version consistency check
          RUN_BIN="./${{ matrix.artifact }}"
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" && "$(uname -s)" != "Darwin" ]]; then
            cargo build --release --locked
            RUN_BIN="./target/release/${{ matrix.bin }}"
            file "${{ matrix.artifact }}" | grep -E "Mach-O 64-bit.*arm64"
          fi
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          BIN_VER_OUT=$("$RUN_BIN" --version | tr -d '\r')
          if [[ "$BIN_VER_OUT" != "agpop ${CARGO_VER}" ]]; then
            echo "ERROR: binary --version ('${BIN_VER_OUT}') does not match Cargo.toml ('agpop ${CARGO_VER}')" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${CARGO_VER}" ]]; then
              echo "ERROR: release tag '${GITHUB_REF_NAME}' does not match Cargo.toml version 'v${CARGO_VER}'" >&2
              exit 1
            fi
          fi
          "$RUN_BIN" init --help

          # 2. OS baseline & static-linking verification
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            file "${{ matrix.artifact }}" | grep -E "statically linked|static-pie linked"
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$PWD:/work:ro" ubuntu:18.04 "/work/${{ matrix.artifact }}" --version
            fi
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            otool -l "${{ matrix.artifact }}" | grep -A 4 "LC_BUILD_VERSION" | grep "minos 11.0"
          elif [[ "${{ matrix.os }}" == windows-* ]]; then
            if grep -Eiaq "vcruntime140\.dll|msvcp140\.dll" "${{ matrix.artifact }}"; then
              echo "ERROR: dynamic VC++ runtime DLL dependency detected in ${{ matrix.artifact }}" >&2
              exit 1
            fi
          fi
      - name: Live End-to-End Mail Exchange (mail.sealedbyte.com)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          rm -rf e2e_a e2e_b
          mkdir -p e2e_a e2e_b
          RUN_BIN="./${{ matrix.artifact }}"
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" && "$(uname -s)" != "Darwin" ]]; then
            RUN_BIN="./target/release/${{ matrix.bin }}"
          fi

          echo "Provisioning two live accounts (cieeea & cieeeb) concurrently..."
          "$RUN_BIN" init --prefix cieeea --wait --config e2e_a/identity.json > e2e_a/init.json &
          PID_A=$!
          "$RUN_BIN" init --prefix cieeeb --wait --config e2e_b/identity.json > e2e_b/init.json &
          PID_B=$!
          wait "$PID_A"
          wait "$PID_B"

          EMAIL_A=$("$RUN_BIN" status --config e2e_a/identity.json | sed -n 's/.*"email": *"\([^"]*\)".*/\1/p')
          EMAIL_B=$("$RUN_BIN" status --config e2e_b/identity.json | sed -n 's/.*"email": *"\([^"]*\)".*/\1/p')
          echo "Provisioned EMAIL_A=$EMAIL_A and EMAIL_B=$EMAIL_B in ${SECONDS}s"

          MSG_A2B="E2E-A2B-${{ matrix.artifact }}-$(date +%s)"
          "$RUN_BIN" send --config e2e_a/identity.json --to "$EMAIL_B" --subject "CI E2E A->B" --body "$MSG_A2B"
          "$RUN_BIN" wait --timeout 15 --config e2e_b/identity.json --inbox-dir e2e_b/inbox > /dev/null
          READ_B=$("$RUN_BIN" inbox read latest --config e2e_b/identity.json --inbox-dir e2e_b/inbox)
          echo "$READ_B" | grep -Fq "$MSG_A2B"

          MSG_B2A="E2E-B2A-${{ matrix.artifact }}-$(date +%s)"
          "$RUN_BIN" reply latest --config e2e_b/identity.json --inbox-dir e2e_b/inbox --body "$MSG_B2A"
          "$RUN_BIN" wait --timeout 15 --config e2e_a/identity.json --inbox-dir e2e_a/inbox > /dev/null
          READ_A=$("$RUN_BIN" inbox read latest --config e2e_a/identity.json --inbox-dir e2e_a/inbox)
          echo "$READ_A" | grep -Fq "$MSG_B2A"

          rm -rf e2e_a e2e_b
          echo "Live E2E bidirectional exchange verified in ${SECONDS}s"
      - name: Upload Workflow Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Publish Complete Release (Draft -> Verify -> Publish)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All 5 Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate & Verify Release Manifest
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/agpop-linux-amd64
          python3 scripts/generate_release_manifest.py \
            --dist-dir dist \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --cargo-toml Cargo.toml \
            --verify-bin dist/agpop-linux-amd64
          cat dist/release-manifest.json
      - name: Draft, Upload, Verify & Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
          else
            PRERELEASE_ARGS=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $TAG is already published; verifying idempotency..."
              mkdir -p existing_rel
              gh release download "$TAG" -p "release-manifest.json" -D existing_rel
              if python3 scripts/generate_release_manifest.py \
                --verify-idempotent existing_rel/release-manifest.json dist/release-manifest.json; then
                echo "Existing published release $TAG matches identical manifest; done."
                exit 0
              elif [[ "$TAG" == *-* ]]; then
                echo "Prerelease $TAG moved to new commit ${GITHUB_SHA}; updating release assets..."
                gh release edit "$TAG" --notes "Release ${TAG} (${GITHUB_SHA})"
              else
                exit 1
              fi
            fi
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "agpop ${TAG}" \
              --notes "Release ${TAG} (${GITHUB_SHA})" \
              "${PRERELEASE_ARGS[@]}"
          fi

          gh release upload "$TAG" \
            dist/agpop-linux-amd64 dist/agpop-linux-amd64.sha256 \
            dist/agpop-linux-arm64 dist/agpop-linux-arm64.sha256 \
            dist/agpop-darwin-arm64 dist/agpop-darwin-arm64.sha256 \
            dist/agpop-windows-amd64.exe dist/agpop-windows-amd64.exe.sha256 \
            dist/agpop-windows-arm64.exe dist/agpop-windows-arm64.exe.sha256 \
            dist/SHA256SUMS dist/release-manifest.json \
            --clobber

          gh release view "$TAG" --json assets > dist/draft-assets.json
          python3 scripts/generate_release_manifest.py \
            --verify-draft-assets dist/draft-assets.json \
            --dist-dir dist

          gh release edit "$TAG" --draft=false "${PRERELEASE_ARGS[@]}"
